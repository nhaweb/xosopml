<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minh Luan Lucky Gold Coin Favicon - Transparent Background -->
  <circle cx="90" cy="90" r="86" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="4"/>
  <circle cx="90" cy="90" r="72" fill="#8B0000" stroke="#FFD700" stroke-width="3"/>
  <circle cx="90" cy="90" r="66" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Stylized ML for Minh Luan -->
  <text x="90" y="103" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#textGold)" letter-spacing="1">ML</text>
  <text x="90" y="128" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFE082" letter-spacing="2">XỔ SỐ</text>
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="textGold" x1="90" y1="60" x2="90" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
</svg>
